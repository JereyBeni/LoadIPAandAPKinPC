name: Windows (WSL)

# Primary: native MinGW via MSYS2 on windows-latest.
# Optional WSL job only on workflow_dispatch or commit message [wsl].
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-native:
    name: Build (Windows x64 / MinGW)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-pkgconf
            zip

      - name: Configure
        run: |
          mkdir -p build
          cmake -S . -B build \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Locate binary + smoke test
        id: bin
        run: |
          set -e
          if [ -f build/loadipaapk.exe ]; then
            BIN="build/loadipaapk.exe"
          elif [ -f build/loadipaapk ]; then
            BIN="build/loadipaapk"
          else
            echo "Binary not found"
            find build -type f | head -50
            exit 1
          fi
          echo "Found: $BIN"
          "./$BIN" help || "./$BIN" --help || true
          echo "path=$BIN" >> "$GITHUB_OUTPUT"

      - name: Pack zip (MSYS2 zip)
        run: |
          set -e
          SHORT="${GITHUB_SHA:0:7}"
          OUT_DIR="dist/LoadIPAandAPKinPC-windows-x64"
          mkdir -p "$OUT_DIR"

          BIN="${{ steps.bin.outputs.path }}"
          if [ -z "$BIN" ]; then
            if [ -f build/loadipaapk.exe ]; then BIN="build/loadipaapk.exe"
            else BIN="build/loadipaapk"; fi
          fi

          cp "$BIN" "$OUT_DIR/"

          for dll in /ucrt64/bin/SDL2.dll /ucrt64/bin/zlib1.dll \
                     /ucrt64/bin/libstdc++-6.dll /ucrt64/bin/libgcc_s_seh-1.dll \
                     /ucrt64/bin/libwinpthread-1.dll; do
            if [ -f "$dll" ]; then cp "$dll" "$OUT_DIR/"; fi
          done

          cp README.md "$OUT_DIR/" 2>/dev/null || true
          {
            echo "LoadIPAandAPKinPC Windows x64 (MinGW/UCRT64)"
            echo "commit: $GITHUB_SHA"
            echo "ref: $GITHUB_REF"
            echo "runner: windows-latest + MSYS2 UCRT64"
          } > "$OUT_DIR/BUILD_INFO.txt"

          cd dist
          zip -r "LoadIPAandAPKinPC-windows-x64-${SHORT}.zip" "LoadIPAandAPKinPC-windows-x64"
          ls -la
          cp "LoadIPAandAPKinPC-windows-x64-${SHORT}.zip" "LoadIPAandAPKinPC-windows-x64.zip"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoadIPAandAPKinPC-windows-x64
          path: |
            dist/LoadIPAandAPKinPC-windows-x64-*.zip
            dist/LoadIPAandAPKinPC-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  build-wsl:
    name: Build (Windows WSL2 / Ubuntu)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[wsl]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: WSL note
        shell: powershell
        run: |
          Write-Host "Optional WSL job — primary Windows zip comes from the MinGW job."
          Write-Host "Trigger with workflow_dispatch or commit message containing [wsl]."
