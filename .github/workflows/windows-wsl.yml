name: Windows (WSL)

# Primary: native MinGW via MSYS2 on windows-latest (reliable CI).
# Optional WSL2 job: only on workflow_dispatch or commit message containing [wsl].
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-native:
    name: Build (Windows x64 / MinGW)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-pkgconf
            zip

      - name: Configure
        run: |
          mkdir -p build
          cmake -S . -B build \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Locate binary
        id: bin
        shell: bash
        run: |
          set -e
          BIN=""
          if [ -f build/loadipaapk.exe ]; then BIN="build/loadipaapk.exe"
          elif [ -f build/loadipaapk ]; then BIN="build/loadipaapk"
          else
            echo "Binary not found"; find build -type f | head -50; exit 1
          fi
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          echo "Found: $BIN"

      - name: Smoke test (CLI help)
        shell: bash
        run: |
          BIN="${{ steps.bin.outputs.path }}"
          "./$BIN" help || "./$BIN" --help || true

      - name: Pack zip
        shell: bash
        run: |
          set -e
          SHORT="${GITHUB_SHA:0:7}"
          OUT_DIR="dist/LoadIPAandAPKinPC-windows-x64"
          mkdir -p "$OUT_DIR"
          BIN="${{ steps.bin.outputs.path }}"
          cp "$BIN" "$OUT_DIR/"
          UCRT="/ucrt64/bin"
          for dll in SDL2.dll zlib1.dll libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll; do
            if [ -f "$UCRT/$dll" ]; then cp "$UCRT/$dll" "$OUT_DIR/"; fi
          done
          cp README.md "$OUT_DIR/" 2>/dev/null || true
          echo "LoadIPAandAPKinPC Windows x64 (MinGW/UCRT64)" > "$OUT_DIR/BUILD_INFO.txt"
          echo "commit: $GITHUB_SHA" >> "$OUT_DIR/BUILD_INFO.txt"
          echo "ref: $GITHUB_REF" >> "$OUT_DIR/BUILD_INFO.txt"
          echo "runner: windows-latest + MSYS2 UCRT64" >> "$OUT_DIR/BUILD_INFO.txt"
          echo "note: WSL is for local Windows dev; CI primary build is native MinGW." >> "$OUT_DIR/BUILD_INFO.txt"
          mkdir -p dist
          cd dist
          zip -r "LoadIPAandAPKinPC-windows-x64-${SHORT}.zip" "LoadIPAandAPKinPC-windows-x64"
          ls -la

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoadIPAandAPKinPC-windows-x64
          path: dist/LoadIPAandAPKinPC-windows-x64-*.zip
          if-no-files-found: error
          retention-days: 30

  build-wsl:
    name: Build (Windows WSL2 / Ubuntu)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[wsl]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: WSL note
        shell: powershell
        run: |
          Write-Host "Optional WSL job: enable via workflow_dispatch or commit message [wsl]"
          Write-Host "Primary Windows artifact comes from the MinGW job above."
